<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Jessica 💖</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <style>
    body {
      background: linear-gradient(135deg, #ffe4e6, #fbcfe8);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", sans-serif;
    }

    .card {
      border-radius: 20px;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .heart {
      font-size: 3rem;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    /* Soft glow for name */
    .glow-name {
      color: #db2777;
      text-shadow: 0 0 10px rgba(219,39,119,0.6);
      animation: glow 2.5s ease-in-out infinite;
    }

    @keyframes glow {
      0% { text-shadow: 0 0 5px rgba(219,39,119,0.4); }
      50% { text-shadow: 0 0 16px rgba(219,39,119,0.9); }
      100% { text-shadow: 0 0 5px rgba(219,39,119,0.4); }
    }

    .typing {
      min-height: 140px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script>
    const { useState, useEffect } = React;

    function App() {
      const message =
        "Jay wants you to know something special.\n\n" +
        "He truly believes that you definitely belong with him, " +
        "and that it’s time to lock in to love — with honesty, care, " +
        "and real intentions.\n\n" +
        "No pressure. Just sincerity 💗";

      const [text, setText] = useState("");
      const [index, setIndex] = useState(0);

      useEffect(() => {
        if (index < message.length) {
          const t = setTimeout(() => {
            setText(prev => prev + message.charAt(index));
            setIndex(prev => prev + 1);
          }, 40);
          return () => clearTimeout(t);
        }
      }, [index]);

      return (
        React.createElement(
          "div",
          { className: "container" },
          React.createElement(
            "div",
            {
              className: "card shadow-lg p-4 text-center mx-auto",
              style: { maxWidth: "420px" }
            },

            React.createElement("div", { className: "heart mb-3" }, "💖"),

            React.createElement(
              "h2",
              { className: "fw-bold mb-3 glow-name" },
              "Jessica"
            ),

            React.createElement(
              "div",
              { className: "typing text-muted fs-5 mt-3" },
              text
            ),

            React.createElement(
              "button",
              {
                onClick: sendWhatsAppReply,
                className: "btn btn-success btn-lg mt-4 w-100"
              },
              "Reply on WhatsApp 💬"
            )
          )
        )
      );
    }

    function sendWhatsAppReply() {
      const replyMessage =
        "Hey Jay 💗\n\n" +
        "I saw your message and it really made me smile. " +
        "Let’s talk and see where love takes us 😊";

      const encoded = encodeURIComponent(replyMessage);

      // Opens WhatsApp with pre-filled message (user chooses to send)
      window.open("https://wa.me/?text=" + encoded, "_blank");
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      React.createElement(App)
    );
  </script>
</body>
</html>
